<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0614">
<title>Charlie's Spooky Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bar-h: 18vh;
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><circle cx='24' cy='24' r='15' fill='%23ff7b00' stroke='%23200a2e' stroke-width='4'/><path d='M17 22 l3 -4 l3 4 z M25 22 l3 -4 l3 4 z M17 28 q7 5 14 0' fill='%23200a2e' stroke='%23200a2e' stroke-width='1.5'/></svg>") 24 24, pointer;
    --btn: min(14vh, 26vw);
    --btn-s: min(11.5vh, 21vw);
  }
  @supports (height: 1dvh) { :root { --bar-h: 18dvh; --btn: min(14dvh, 26vw); --btn-s: min(11.5dvh, 21vw); } }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #2a1648, #120a22 60%, #07040d);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; cursor: var(--cursor);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--bar-h)); overflow: hidden; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: var(--cursor); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(8,3,16,0.55)); }
  #bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 50% 100%;
    padding: 0.35em 0.8em; border-radius: 1em;
    background: #2a1238; color: #fff3e0; border: 3px solid #ff7b00;
    font: 400 clamp(18px, 3.4vmin, 30px) "Creepster", "Arial Rounded MT Bold", sans-serif; letter-spacing: 0.04em;
    box-shadow: 0 0 14px rgba(255,123,0,0.55);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -9px;
    border: 9px solid transparent; border-top-color: #ff7b00; border-bottom: 0;
  }
  #moon {
    position: absolute; top: 14px; right: 16px; width: min(13vh, 17vw); height: min(13vh, 17vw); border-radius: 50%;
    background: radial-gradient(circle at 40% 38%, #fffbe6, #ffe9a8 55%, #e8c66e);
    box-shadow: 0 0 30px 8px rgba(255,236,170,0.45), 0 0 90px 30px rgba(255,220,140,0.15);
    cursor: var(--cursor); overflow: hidden;
  }
  #moon::before { content: ""; position: absolute; width: 22%; height: 22%; left: 52%; top: 22%; border-radius: 50%; background: rgba(200,170,90,0.35); box-shadow: -28px 30px 0 -2px rgba(200,170,90,0.28); }
  #moon svg { position: absolute; left: 8%; bottom: -100%; width: 84%; height: 84%; }
  #moon.wolf svg { animation: wolf 2.2s ease-in-out; }
  @keyframes wolf { 0% { bottom: -100%; } 25%, 75% { bottom: -2%; } 100% { bottom: -100%; } }

  #bar {
    position: absolute; left: 0; bottom: 0; width: 100%; height: var(--bar-h);
    display: flex; align-items: center; justify-content: center; gap: 7vw;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 70px),
      linear-gradient(#2a1238, #0e0716);
    border-top: 0.7vh solid #ff7b00;
    box-shadow: 0 -0.6vh 2.5vh rgba(255,123,0,0.45);
    box-sizing: border-box; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .web { position: absolute; top: 0; width: calc(var(--bar-h) * 0.9); height: calc(var(--bar-h) * 0.9); opacity: 0.4; pointer-events: none; }
  .web.l { left: 0; }
  .web.r { right: 0; transform: scaleX(-1); }
  .btn {
    width: var(--btn); height: var(--btn); border-radius: 50%; flex: none;
    border: 0.6vh solid rgba(255,255,255,0.55); padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: var(--cursor); outline: none; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, filter 0.2s;
    filter: saturate(0.75) brightness(0.8);
  }
  .btn svg { width: 64%; height: 64%; pointer-events: none; overflow: visible; }
  .stop { background: radial-gradient(circle at 35% 30%, #ff5c5c, #8a0000 62%, #2a0000); box-shadow: 0 0 2.2vh #ff2a2a, inset 0 -1vh 2vh rgba(0,0,0,0.55); }
  .go   { background: radial-gradient(circle at 35% 30%, #b3ff8a, #1f8a1f 62%, #062b06); box-shadow: 0 0 2.2vh #5dff3a, inset 0 -1vh 2vh rgba(0,0,0,0.55); }
  .toot { background: radial-gradient(circle at 35% 30%, #e2b8ff, #5b1f8a 62%, #1e0733); box-shadow: 0 0 2.2vh #b05cff, inset 0 -1vh 2vh rgba(0,0,0,0.55);
          width: var(--btn-s); height: var(--btn-s); }
  .btn.on { filter: none; }
  .btn.pressed { transform: scale(0.9); }
  .btn.pulse { animation: pulse 0.9s ease-in-out infinite; filter: none; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); filter: brightness(1.25); }
  }

  /* phones held sideways: the buttons move into a column on the right so they stay big */
  @media (orientation: landscape) and (max-height: 560px) {
    :root { --side-w: min(30vh, 22vw); --btn: min(27vh, 19vw); --btn-s: min(21vh, 15vw); }
    @supports (height: 1dvh) { :root { --side-w: min(30dvh, 22vw); --btn: min(27dvh, 19vw); --btn-s: min(21dvh, 15vw); } }
    #stage { width: calc(100% - var(--side-w)); height: 100%; }
    #bar {
      left: auto; right: 0; top: 0; bottom: 0; width: var(--side-w); height: 100%;
      flex-direction: column; gap: 4vh;
      border-top: 0; border-left: 0.7vw solid #ff7b00; box-shadow: -0.6vw 0 2.5vw rgba(255,123,0,0.45);
      padding: 0 env(safe-area-inset-right, 0) 0 0;
    }
    .btn { border-width: 0.6vw; }
    .web { width: calc(var(--side-w) * 0.7); height: calc(var(--side-w) * 0.7); }
    .web.r { top: auto; bottom: 0; right: 0; transform: scale(-1, -1); }
  }

  #corner { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5; }
  #corner button {
    width: 46px; height: 46px; border-radius: 12px; border: 1px solid rgba(255,123,0,0.5); padding: 0;
    background: rgba(30,12,45,0.75); color: #ffb347; cursor: var(--cursor);
    display: flex; align-items: center; justify-content: center;
  }
  #corner button svg { width: 26px; height: 26px; }
  #corner button.on { background: rgba(255,123,0,0.85); color: #2a1238; }
  #muteBtn .x { display: none; }
  #muteBtn.off .x { display: inline; }
  #muteBtn.off .w { display: none; }

  #start {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(11,6,20,0.25), rgba(11,6,20,0.8));
    transition: opacity 0.6s;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #start h1 {
    margin: 0 4vw 2vh; font-family: "Creepster", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 400;
    font-size: min(13vh, 12vw); color: #ff7b00; letter-spacing: 0.04em; text-align: center; line-height: 1.05;
    text-shadow: 0 0 2vh rgba(255,123,0,0.7), 0 0.6vh 0 #3a0a4a;
  }
  #play {
    margin-top: 3vh; width: min(24vh, 38vw); height: min(24vh, 38vw); border-radius: 50%;
    border: 1vh solid rgba(255,255,255,0.6); cursor: var(--cursor); padding: 0;
    background: radial-gradient(circle at 35% 30%, #b3ff8a, #1f8a1f 62%, #062b06);
    box-shadow: 0 0 5vh #5dff3a;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #play svg { width: 55%; height: 55%; }
  body:not(.ready) #play { opacity: 0.35; animation: none; pointer-events: none; }
  #loading { color: #ffb347; margin-top: 2vh; font-size: min(3vh, 4.5vw); min-height: 1.4em; text-align: center; padding: 0 6vw; }
  body.ready #loading { visibility: hidden; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="moon" aria-label="The moon">
    <svg viewBox="0 0 100 100"><path d="M18 100 L22 74 C20 66 24 58 30 54 L34 40 L30 26 L38 34 L44 30 L58 10 L60 18 L66 14 L62 30 C70 36 72 44 70 52 C78 60 82 74 80 100 Z" fill="#1a0f22"/></svg>
  </div>
  <div id="bubbles"></div>
</div>

<div id="bar">
  <svg class="web l" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="1.6"><path d="M0 0 L100 100 M0 0 L100 40 M0 0 L40 100 M0 0 L100 8 M0 0 L8 100"/><path d="M30 0 Q24 10 30 30 Q12 24 0 30 M55 0 Q46 20 52 52 Q22 44 0 55 M80 0 Q70 34 76 76 Q34 68 0 80"/></svg>
  <svg class="web r" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="1.6"><path d="M0 0 L100 100 M0 0 L100 40 M0 0 L40 100 M0 0 L100 8 M0 0 L8 100"/><path d="M30 0 Q24 10 30 30 Q12 24 0 30 M55 0 Q46 20 52 52 Q22 44 0 55 M80 0 Q70 34 76 76 Q34 68 0 80"/></svg>
  <button class="btn stop" id="stopBtn" aria-label="Stop">
    <svg viewBox="0 0 100 100"><path d="M26 24 h48 a4 4 0 0 1 4 4 v42 c0 4 -4 4 -5 1 c-2 10 -8 10 -8 1 c-1 -3 -3 -3 -4 0 c-1 14 -9 14 -10 0 c-1 -3 -3 -3 -4 0 c-1 8 -8 8 -8 -1 c-1 -3 -3 -3 -4 0 c-2 6 -9 4 -9 -2 v-41 a4 4 0 0 1 4 -4 z" fill="#ffe9e9"/></svg>
  </button>
  <button class="btn toot" id="tootBtn" aria-label="Spooky whistle">
    <svg viewBox="0 0 100 100"><path d="M22 88 V46 a28 28 0 0 1 56 0 V88 l-9 -8 l-9 8 l-10 -8 l-10 8 l-9 -8 z" fill="#f5edff"/><ellipse cx="40" cy="46" rx="6" ry="9" fill="#1e0733"/><ellipse cx="60" cy="46" rx="6" ry="9" fill="#1e0733"/><ellipse cx="50" cy="66" rx="6" ry="8" fill="#1e0733"/></svg>
  </button>
  <button class="btn go" id="goBtn" aria-label="Go">
    <svg viewBox="0 0 100 100"><path d="M34 22 L80 50 L34 78 Z" fill="#effff0" stroke="#effff0" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="corner">
  <button id="muteBtn" aria-label="Sound on or off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 h4 l5 -4 v14 l-5 -4 h-4 z" fill="currentColor"/><path class="w" d="M16 8.5 a5 5 0 0 1 0 7 M18.5 6 a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9 l6 6 M22 9 l-6 6"/></svg>
  </button>
  <button id="fsBtn" aria-label="Full screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9 V4 h5 M15 4 h5 v5 M20 15 v5 h-5 M9 20 H4 v-5"/></svg>
  </button>
  <button id="mapBtn" aria-label="See the whole railway">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12 C5 6 9 4 12 7 C15 4 19 6 19 12 C19 18 15 20 12 17 C9 20 5 18 5 12 Z"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
  </button>
</div>

<div id="start">
  <h1>Charlie's Spooky Train</h1>
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 100 100"><path d="M34 20 L82 50 L34 80 Z" fill="#effff0" stroke="#effff0" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
  <div id="loading">Building the railway…</div>
</div>

<script>
  // if the 3D engine can't load (no internet, very old browser), say so instead of sitting there
  window.addEventListener('error', (e) => { document.getElementById('loading').textContent = 'Oh no, the spooky train got stuck: ' + (e.message || 'error'); });
  setTimeout(() => {
    if (!document.body.classList.contains('ready')) document.getElementById('loading').textContent = 'Still loading… this needs the internet the first time.';
  }, 12000);
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
