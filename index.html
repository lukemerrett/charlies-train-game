<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Charlie's Spooky Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  :root {
    --bar-h: 18vh;
    --cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><circle cx='24' cy='24' r='15' fill='%23ff7b00' stroke='%23200a2e' stroke-width='4'/><path d='M17 22 l3 -4 l3 4 z M25 22 l3 -4 l3 4 z M17 28 q7 5 14 0' fill='%23200a2e' stroke='%23200a2e' stroke-width='1.5'/></svg>") 24 24, pointer;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0614;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; cursor: var(--cursor);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  #game {
    position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--bar-h));
    display: block; cursor: var(--cursor);
  }
  #bar {
    position: absolute; left: 0; bottom: 0; width: 100%; height: var(--bar-h);
    display: flex; align-items: center; justify-content: center; gap: 7vw;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 70px),
      linear-gradient(#2a1238, #0e0716);
    border-top: 0.7vh solid #ff7b00;
    box-shadow: 0 -0.6vh 2.5vh rgba(255,123,0,0.45);
    box-sizing: border-box; overflow: hidden;
  }
  .web { position: absolute; top: -1vh; font-size: 13vh; opacity: 0.35; pointer-events: none; line-height: 1; }
  .web.l { left: -1vh; }
  .web.r { right: -1vh; transform: scaleX(-1); }
  .btn {
    width: min(14vh, 26vw); height: min(14vh, 26vw); border-radius: 50%;
    border: 0.6vh solid rgba(255,255,255,0.55); padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: var(--cursor); outline: none; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, filter 0.2s;
    filter: saturate(0.75) brightness(0.8);
  }
  .btn svg { width: 64%; height: 64%; pointer-events: none; overflow: visible; }
  .stop { background: radial-gradient(circle at 35% 30%, #ff5c5c, #8a0000 62%, #2a0000); box-shadow: 0 0 2.2vh #ff2a2a, inset 0 -1vh 2vh rgba(0,0,0,0.55); }
  .go   { background: radial-gradient(circle at 35% 30%, #b3ff8a, #1f8a1f 62%, #062b06); box-shadow: 0 0 2.2vh #5dff3a, inset 0 -1vh 2vh rgba(0,0,0,0.55); }
  .toot { background: radial-gradient(circle at 35% 30%, #e2b8ff, #5b1f8a 62%, #1e0733); box-shadow: 0 0 2.2vh #b05cff, inset 0 -1vh 2vh rgba(0,0,0,0.55);
          width: min(11.5vh, 21vw); height: min(11.5vh, 21vw); }
  .btn.on { filter: none; }
  .btn.pressed { transform: scale(0.9); }
  .btn.pulse { animation: pulse 0.9s ease-in-out infinite; filter: none; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); filter: brightness(1.25); }
  }
  #corner { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5; }
  #corner button {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,123,0,0.5);
    background: rgba(30,12,45,0.7); color: #ffb347; font-size: 22px; cursor: var(--cursor);
  }
  #start {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 78% 20%, #fff7d6 0 6vh, rgba(255,240,190,0.25) 6.5vh, transparent 16vh),
                linear-gradient(#0b0614, #2b1250 70%, #1c2a1a 70%);
    cursor: var(--cursor);
  }
  #start h1 {
    margin: 0 0 2vh; font-family: "Creepster", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 400;
    font-size: min(13vh, 12vw); color: #ff7b00; letter-spacing: 0.04em; text-align: center;
    text-shadow: 0 0 2vh rgba(255,123,0,0.7), 0 0.6vh 0 #3a0a4a;
  }
  #start .choo { font-size: min(13vh, 15vw); animation: chug 0.6s ease-in-out infinite; }
  @keyframes chug { 50% { transform: translateY(-1.2vh); } }
  #play {
    margin-top: 4vh; width: min(24vh, 38vw); height: min(24vh, 38vw); border-radius: 50%;
    border: 1vh solid rgba(255,255,255,0.6); cursor: var(--cursor);
    background: radial-gradient(circle at 35% 30%, #b3ff8a, #1f8a1f 62%, #062b06);
    box-shadow: 0 0 5vh #5dff3a;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #play svg { width: 55%; height: 55%; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="bar">
  <span class="web l">🕸️</span><span class="web r">🕸️</span>
  <button class="btn stop" id="stopBtn" aria-label="Stop">
    <svg viewBox="0 0 100 100"><path d="M26 24 h48 a4 4 0 0 1 4 4 v42 c0 4 -4 4 -5 1 c-2 10 -8 10 -8 1 c-1 -3 -3 -3 -4 0 c-1 14 -9 14 -10 0 c-1 -3 -3 -3 -4 0 c-1 8 -8 8 -8 -1 c-1 -3 -3 -3 -4 0 c-2 6 -9 4 -9 -2 v-41 a4 4 0 0 1 4 -4 z" fill="#ffe9e9"/></svg>
  </button>
  <button class="btn toot" id="tootBtn" aria-label="Spooky whistle">
    <svg viewBox="0 0 100 100"><path d="M22 88 V46 a28 28 0 0 1 56 0 V88 l-9 -8 l-9 8 l-10 -8 l-10 8 l-9 -8 z" fill="#f5edff"/><ellipse cx="40" cy="46" rx="6" ry="9" fill="#1e0733"/><ellipse cx="60" cy="46" rx="6" ry="9" fill="#1e0733"/><ellipse cx="50" cy="66" rx="6" ry="8" fill="#1e0733"/></svg>
  </button>
  <button class="btn go" id="goBtn" aria-label="Go">
    <svg viewBox="0 0 100 100"><path d="M34 22 L80 50 L34 78 Z" fill="#effff0" stroke="#effff0" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="corner">
  <button id="muteBtn" aria-label="Sound on or off">🔊</button>
  <button id="fsBtn" aria-label="Full screen">⛶</button>
</div>

<div id="start">
  <h1>Charlie's Spooky Train</h1>
  <div class="choo"><span style="display:inline-block;transform:scaleX(-1)">🎃🚂👻</span></div>
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 100 100"><path d="M34 20 L82 50 L34 80 Z" fill="#effff0" stroke="#effff0" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
'use strict';

// ============================================================
// Constants
// ============================================================
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TEXT_FONT = '"Arial Rounded MT Bold","Trebuchet MS",' + EMOJI_FONT;

// The model railway board, in world units. x runs down-right on screen, y down-left, z up.
const BW = 1400, BH = 900, THICK = 46;
const C = 0.8660254, SN = 0.5;     // isometric projection factors
const STEP = 4;                    // track sample spacing

const ENG_LEN = 112, CAR_LEN = 88, GAP = 14, NCARS = 3, SEATS = 6, CAR_TOP = 40;
const MID = ENG_LEN / 2 + GAP + (NCARS * CAR_LEN + (NCARS - 1) * GAP) / 2; // engine centre -> middle of the carriages
const MAXV = 170, ACC = 110, DEC = 160;
const SPOT_OFF = [-125, -75, -25, 25, 75, 125];
const TUN = 150; // tunnel half length

const PASSENGERS = ['👻','🎃','🧙','🧛','🐈‍⬛','🦇','🕷️','🐺','🦉','🧟','🧌','🐀','👽','🧙‍♂️','🧛‍♀️'];
const SPARK = ['#ff7b00', '#b05cff', '#7cff4f', '#ffd23f'];
const CAR_COLORS = ['#6a2c9c', '#2f7a3e', '#b4501a'];

// Track loop control points (closed Catmull-Rom spline)
const CTRL = [[400,215],[700,195],[1000,205],[1210,270],[1275,440],[1200,660],[1000,760],[790,725],[640,630],[500,720],[320,770],[190,650],[170,420],[240,265]];
const STREAM = [[700,470],[690,470],[620,560],[560,680],[520,800],[500,905],[500,915]];
const POND = { x: 730, y: 420, rx: 125, ry: 82 };

// stations sit at these distances along the track, spaced out around the loop
const STATION_DEFS = [
  { s: 150,  sign: '🎃', wall: '#7a3b12', roof: '#ff7b00', towers: 0 },
  { s: 1000, sign: '👻', wall: '#4b3b66', roof: '#22182f', towers: 1 },
  { s: 1600, sign: '🧹', wall: '#2c5435', roof: '#6a2c9c', towers: 0 },
  { s: 2450, sign: '🦇', wall: '#5c5868', roof: '#2a2533', towers: 2 },
];

// ============================================================
// Canvas & camera
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cw = 1280, ch = 720, dpr = 1;
const cam = { x: 0, y: 0, zoom: 0.5, follow: false };

const VIEW = { minX: -BH * C - 20, maxX: BW * C + 20, minY: -170, maxY: (BW + BH) * SN + THICK + 20 };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const fit = Math.min(cw / (VIEW.maxX - VIEW.minX), ch / (VIEW.maxY - VIEW.minY));
  if (fit >= 0.36) {
    // the whole layout fits: show it all, like looking down at a model railway
    cam.follow = false; cam.zoom = fit;
    cam.x = (VIEW.minX + VIEW.maxX) / 2; cam.y = (VIEW.minY + VIEW.maxY) / 2;
  } else {
    // small screens: zoom in and follow the train
    cam.follow = true;
    cam.zoom = Math.max(0.42, Math.min(0.9, Math.min(cw, ch) / 640));
    snapCamera();
  }
}
function cameraTarget() {
  const p = tp(S.s - MID);
  const v = P(p.x, p.y, 30);
  const hw = cw / 2 / cam.zoom, hh = ch / 2 / cam.zoom;
  const fitAxis = (t, lo, hi, half) => (hi - lo <= half * 2 ? (lo + hi) / 2 : clamp(t, lo + half, hi - half));
  return { x: fitAxis(v.x, VIEW.minX, VIEW.maxX, hw), y: fitAxis(v.y, VIEW.minY, VIEW.maxY, hh) };
}
function snapCamera() { const t = cameraTarget(); cam.x = t.x; cam.y = t.y; }
function viewTransform() {
  ctx.setTransform(dpr * cam.zoom, 0, 0, dpr * cam.zoom, dpr * (cw / 2 - cam.x * cam.zoom), dpr * (ch / 2 - cam.y * cam.zoom));
}
const toView = (sx, sy) => ({ x: (sx - cw / 2) / cam.zoom + cam.x, y: (sy - ch / 2) / cam.zoom + cam.y });

// ============================================================
// Maths helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const P = (x, y, z = 0) => ({ x: (x - y) * C, y: (x + y) * SN - z });
function rngFor(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pickR = (r, arr) => arr[Math.floor(r() * arr.length)];
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function cr(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return { x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) };
}

// colour shading with a little cache
const shadeCache = new Map();
function shade(hex, k) {
  const key = hex + k.toFixed(2);
  let v = shadeCache.get(key);
  if (!v) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, ((n >> 16) & 255) * k), g = Math.min(255, ((n >> 8) & 255) * k), b = Math.min(255, (n & 255) * k);
    v = `rgb(${r | 0},${g | 0},${b | 0})`;
    shadeCache.set(key, v);
  }
  return v;
}
// moonlight from the upper right of the screen
function light(nx, ny, nz) {
  const len = Math.hypot(nx, ny, nz) || 1;
  return 0.45 + 0.55 * Math.max(0, (nx * 0.6 - ny * 0.3 + nz) / 1.204 / len);
}

// ============================================================
// Track
// ============================================================
function buildTrack() {
  const n = CTRL.length, pts = [];
  for (let i = 0; i < n; i++) {
    const p0 = CTRL[(i - 1 + n) % n], p1 = CTRL[i], p2 = CTRL[(i + 1) % n], p3 = CTRL[(i + 2) % n];
    for (let k = 0; k < 50; k++) pts.push(cr(p0, p1, p2, p3, k / 50));
  }
  const out = [pts[0]];
  let prev = pts[0], need = STEP;
  for (let i = 1; i <= pts.length; i++) {
    const q = pts[i % pts.length];
    let seg = Math.hypot(q.x - prev.x, q.y - prev.y);
    while (seg >= need) {
      const t = need / seg;
      const np = { x: prev.x + (q.x - prev.x) * t, y: prev.y + (q.y - prev.y) * t };
      out.push(np); prev = np; seg = Math.hypot(q.x - prev.x, q.y - prev.y); need = STEP;
    }
    need -= seg; prev = q;
  }
  return out;
}
const TR = buildTrack();
const N = TR.length;
const L = N * STEP;
const mod = (s) => ((s % L) + L) % L;
const modDist = (a, b) => { let d = mod(a - b); if (d > L / 2) d -= L; return d; };
function tp(s) {
  const f = mod(s) / STEP, i = Math.floor(f) % N, t = f - Math.floor(f);
  const a = TR[i], b = TR[(i + 1) % N];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}
function frame(s) {
  const a = tp(s - 6), b = tp(s + 6), p = tp(s);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const fx = Math.cos(ang), fy = Math.sin(ang);
  return { x: p.x, y: p.y, ang, fx, fy, rx: -fy, ry: fx };
}
function distToTrack(x, y) {
  let bd = Infinity;
  for (let i = 0; i < N; i += 3) bd = Math.min(bd, (TR[i].x - x) ** 2 + (TR[i].y - y) ** 2);
  return Math.sqrt(bd);
}

// the stream that runs under the bridge
const STREAM_PTS = (() => {
  const out = [];
  for (let i = 1; i < STREAM.length - 2; i++) {
    for (let k = 0; k < 20; k++) out.push(cr(STREAM[i - 1], STREAM[i], STREAM[i + 1], STREAM[i + 2], k / 20));
  }
  return out;
})();
function distToStream(x, y) {
  let bd = Infinity;
  for (const p of STREAM_PTS) bd = Math.min(bd, (p.x - x) ** 2 + (p.y - y) ** 2);
  return Math.sqrt(bd);
}
const BRIDGE_S = (() => {
  let best = 0, bd = Infinity;
  for (let i = 0; i < N; i++) { const d = distToStream(TR[i].x, TR[i].y); if (d < bd) { bd = d; best = i; } }
  return best * STEP;
})();
const TUNNEL_S = 620;

// Static ground paths, in view coordinates
function appendRing(path, off, z = 0, s0 = 0, s1 = L, stepS = 8, close = true) {
  let first = true;
  for (let s = s0; s <= s1 + 0.01; s += stepS) {
    const f = frame(s), v = P(f.x + f.rx * off, f.y + f.ry * off, z);
    if (first) { path.moveTo(v.x, v.y); first = false; } else path.lineTo(v.x, v.y);
  }
  if (close) path.closePath();
}
function stripPath(s0, s1, off0, off1, z = 0) {
  const path = new Path2D();
  appendRing(path, off0, z, s0, s1, 6, false);
  for (let s = s1; s >= s0 - 0.01; s -= 6) {
    const f = frame(s), v = P(f.x + f.rx * off1, f.y + f.ry * off1, z);
    path.lineTo(v.x, v.y);
  }
  path.closePath();
  return path;
}
const BALLAST = new Path2D(); appendRing(BALLAST, 26); appendRing(BALLAST, -26);
const RAILS = new Path2D(); appendRing(RAILS, 9, 2); appendRing(RAILS, -9, 2);
const SLEEPERS = (() => {
  const p = new Path2D();
  for (let s = 0; s < L; s += 18) {
    const f = frame(s);
    const pts = [[4, 17], [4, -17], [-4, -17], [-4, 17]].map(([a, b]) => P(f.x + f.fx * a + f.rx * b, f.y + f.fy * a + f.ry * b));
    p.moveTo(pts[0].x, pts[0].y); for (const q of pts.slice(1)) p.lineTo(q.x, q.y); p.closePath();
  }
  return p;
})();
const STREAM_PATH = (() => {
  const left = [], right = [];
  for (let i = 0; i < STREAM_PTS.length; i++) {
    const a = STREAM_PTS[Math.max(0, i - 1)], b = STREAM_PTS[Math.min(STREAM_PTS.length - 1, i + 1)];
    const ang = Math.atan2(b.y - a.y, b.x - a.x), w = 30 + Math.sin(i * 0.15) * 4;
    const p = STREAM_PTS[i];
    left.push(P(p.x - Math.sin(ang) * w, p.y + Math.cos(ang) * w));
    right.push(P(p.x + Math.sin(ang) * w, p.y - Math.cos(ang) * w));
  }
  const path = new Path2D();
  left.forEach((v, i) => i ? path.lineTo(v.x, v.y) : path.moveTo(v.x, v.y));
  right.reverse().forEach(v => path.lineTo(v.x, v.y));
  path.closePath();
  return path;
})();
const STREAM_LINE = (() => {
  const p = new Path2D();
  STREAM_PTS.forEach((q, i) => { const v = P(q.x, q.y); i ? p.lineTo(v.x, v.y) : p.moveTo(v.x, v.y); });
  return p;
})();
const BRIDGE_DECK = stripPath(BRIDGE_S - 56, BRIDGE_S + 56, -34, 34);

// ============================================================
// State
// ============================================================
const S = {
  started: false, muted: false,
  s: 0, v: 0, mode: 'stopped', target: null,
  atStation: null, approach: null, notified: null, readyToGo: false,
  time: 0, chuffAcc: 0, smokeAcc: 0, tootT: -9, lastToot: -9, stoppedAt: 0,
  seats: new Array(SEATS).fill(null),
  hoppers: [], smoke: [], particles: [], bubbles: [], bats: [], nextBats: 4,
  seq: [], seqTimer: 0, moonT: -9, nextWind: 8, patches: [],
};
let hits = [];

// ============================================================
// Audio
// ============================================================
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  master = AC.createGain();
  master.gain.value = S.muted ? 0 : 0.8;
  master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function envelope(g, t, vol, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function tone(o) {
  if (!AC) return;
  const t = AC.currentTime + (o.at || 0);
  const osc = AC.createOscillator();
  osc.type = o.type || 'sine';
  if (o.curve) osc.frequency.setValueCurveAtTime(new Float32Array(o.curve), t, o.dur);
  else {
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  }
  let node = osc;
  if (o.lp || o.bp) {
    const f = AC.createBiquadFilter();
    f.type = o.lp ? 'lowpass' : 'bandpass';
    f.frequency.value = o.lp || o.bp;
    if (o.q) f.Q.value = o.q;
    node.connect(f); node = f;
  }
  const g = AC.createGain();
  envelope(g, t, o.vol || 0.2, o.attack || 0.01, o.dur);
  node.connect(g); g.connect(master);
  if (o.vib) {
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
    l.connect(lg); lg.connect(osc.frequency);
    l.start(t); l.stop(t + o.dur + 0.05);
  }
  osc.start(t); osc.stop(t + o.dur + 0.05);
}
function noise(o) {
  if (!AC) return;
  const t = AC.currentTime + (o.at || 0);
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = o.f; f.Q.value = o.q || 1;
  const g = AC.createGain();
  envelope(g, t, o.vol || 0.1, o.attack || 0.005, o.dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random()); src.stop(t + o.dur + 0.05);
}

function update(dt) {

      }
    } else {

    }

  }

  }

        if (S.notified !== st) { S.notified = st; play('bong', 0.45); st.jt = S.time; }
      }
    }
  }

  if (S.atStation && S.seq.length) {
    S.seqTimer -= dt;
    if (S.seqTimer <= 0) { runSeqStep(S.seq.shift()); S.seqTimer = 0.6; }
  }
  S.hoppers = S.hoppers.filter(h => {
    if (S.time - h.t0 >= h.dur) { h.done(); return false; }
    return true;
  });

  for (const p of S.particles) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  S.particles = S.particles.filter(p => S.time - p.t0 < p.life);
  S.bubbles = S.bubbles.filter(b => S.time - b.t0 < b.life);

  // a flock of bats every so often
  S.nextBats -= dt;
  if (S.nextBats <= 0) {
    S.nextBats = rand(9, 15);
    const fromLeft = Math.random() < 0.5, hw = cw / 2 / cam.zoom;
    const y0 = cam.y - rand(0.05, 0.35) * ch / cam.zoom;
    for (let i = 0; i < 5; i++) {
      S.bats.push({ x: cam.x + (fromLeft ? -hw - 40 - i * 45 : hw + 40 + i * 45), y: y0 + rand(-50, 50), vx: (fromLeft ? 1 : -1) * rand(150, 200), vy: rand(-8, 8), ph: Math.random() * 6 });
    }
  }
  for (const b of S.bats) { b.x += b.vx * dt; b.y += b.vy * dt + Math.sin(S.time * 3 + b.ph) * 0.6; }
  S.bats = S.bats.filter(b => Math.abs(b.x - cam.x) < cw / cam.zoom + 400 && b.y > VIEW.minY - 2000);

  S.nextWind -= dt;
  if (S.nextWind <= 0) { S.nextWind = rand(18, 30); play('wind'); }

  if (cam.follow) {
    const t = cameraTarget();
    const k = 1 - Math.exp(-dt * 3);
    cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k;
  }
}

// an emoji standing on a world point; returns its view-space box
function standingEmoji(e, wx, wy, wz, size, lift = 0) {

const jumpOff = (o, h = 30) => { const u = (S.time - o.jt) / 0.55; return u >= 0 && u < 1 ? -Math.sin(u * Math.PI) * h : 0; };
// a horizontal ellipse lying flat at height z
function isoEllipse(x, y, z, rx, ry, ang = 0) {

}
function glow(x, y, r, color, a = 1) {

function boxGeom(cx, cy, ang, len, wid) {
  const fx = Math.cos(ang), fy = Math.sin(ang), rx = -fy, ry = fx, hl = len / 2, hw = wid / 2;
  return {
    c: [
      [cx + fx * hl - rx * hw, cy + fy * hl - ry * hw],
      [cx + fx * hl + rx * hw, cy + fy * hl + ry * hw],
      [cx - fx * hl + rx * hw, cy - fy * hl + ry * hw],
      [cx - fx * hl - rx * hw, cy - fy * hl - ry * hw],

// run fn with a transform mapping (0..1, 0..1) onto a vertical face, (0,0) at top-left
function withFace(a, b, z0, z1, fn) {
  let A = P(a[0], a[1], z1), B = P(b[0], b[1], z1);
  if (B.x < A.x) [A, B] = [B, A];
  ctx.save();
  ctx.transform(B.x - A.x, B.y - A.y, 0, z1 - z0, A.x, A.y);

function drawBox(cx, cy, z0, h, len, wid, ang, color, deco, topColor) {
  const g = boxGeom(cx, cy, ang, len, wid), z1 = z0 + h;
  for (let i = 0; i < 4; i++) {
    const n = g.n[i];
    if (n[0] + n[1] <= 0.001) continue;
    const a = g.c[i], b = g.c[(i + 1) % 4];
    poly([P(a[0], a[1], z0), P(b[0], b[1], z0), P(b[0], b[1], z1), P(a[0], a[1], z1)], shade(color, light(n[0], n[1], 0)));
    if (deco) withFace(a, b, z0, z1, () => deco(i, n));

  poly(g.c.map(c => P(c[0], c[1], z1)), topColor || shade(color, light(0, 0, 1)));

}
function drawRoof(cx, cy, ang, len, wid, z, rh, color) {
  const g = boxGeom(cx, cy, ang, len, wid);
  const [FL, FR, BR, BL] = g.c.map(c => P(c[0], c[1], z));
  const RF = P(cx + g.fx * len / 2, cy + g.fy * len / 2, z + rh), RB = P(cx - g.fx * len / 2, cy - g.fy * len / 2, z + rh);
  const slope = (nx, ny) => ({ nx: nx * rh, ny: ny * rh, nz: wid / 2 });
  const faces = [
    { pts: [FR, BR, RB, RF], n: slope(g.rx, g.ry) },
    { pts: [BL, FL, RF, RB], n: slope(-g.rx, -g.ry) },
    { pts: [FL, FR, RF], n: { nx: g.fx, ny: g.fy, nz: 0 } },
    { pts: [BR, BL, RB], n: { nx: -g.fx, ny: -g.fy, nz: 0 } },
  ];
  for (const f of faces) {
    if (f.n.nx + f.n.ny + f.n.nz <= 0) continue;

}

  for (const p of S.particles) {
    const age = (S.time - p.t0) / p.life;
    ctx.globalAlpha = clamp(1.2 - age, 0, 1);
    if (p.kind === 'spark') {
      ctx.fillStyle = p.color; ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = p.rot + age * 5 + i * Math.PI / 4, rad = i % 2 ? p.size * 0.4 : p.size; ctx.lineTo(p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad); }
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'drop') { ctx.fillStyle = '#7cffd0'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.5, p.size, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (p.kind === 'leaf') { ctx.fillStyle = p.size > 10 ? '#c4500a' : '#7a3b12'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, p.rot + age * 8, 0, Math.PI * 2); ctx.fill(); }
    else if (p.kind === 'bubble') { ctx.strokeStyle = '#aaff8c'; ctx.lineWidth = 2; circle(p.x, p.y, p.size); ctx.stroke(); }
    else if (p.kind === 'bat') { batShape(p.x, p.y, p.size, S.time * 22 + p.t0); }
    else if (p.kind === 'ghostlet') { ghostShape(p.x + Math.sin(age * 10) * 8, p.y, p.size, p.size * 1.4, 1, 0); }
  }
  ctx.globalAlpha = 1;
}
function drawHoppers() {
  for (const h of S.hoppers) {
    const u = clamp((S.time - h.t0) / h.dur, 0, 1);
    emoji(h.p.e, lerp(h.x0, h.x1, u), lerp(h.y0, h.y1, u) - 24 - Math.sin(u * Math.PI) * 90, 54);
  }
}
function drawBubbleAt(x, y, text, age, size) {
  ctx.font = `bold ${size}px ${TEXT_FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pop = Math.min(1, age * 8);
  const w = ctx.measureText(text).width + size;
  ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
  ctx.globalAlpha = clamp((1 - age) * 3, 0, 1);
  ctx.fillStyle = '#1e1029'; ctx.strokeStyle = '#ff7b00'; ctx.lineWidth = size * 0.12;
  rr(-w / 2, -size * 0.85, w, size * 1.7, size * 0.8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb347'; ctx.fillText(text, 0, 2);
  ctx.restore();
}
function drawBubbles(screen) {
  for (const b of S.bubbles) {
    if (!!b.screen !== screen) continue;
    const age = (S.time - b.t0) / b.life;
    drawBubbleAt(b.x, b.y - age * 30, b.text, age, screen ? 26 : 34);
  }
  ctx.globalAlpha = 1;
}
function drawFog() {
  for (let i = 0; i < 6; i++) {
    const span = VIEW.maxX - VIEW.minX + 600;
    const x = VIEW.minX - 300 + ((S.time * (8 + i * 3) + i * 400) % span);
    const y = 250 + i * 140;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 260);
    g.addColorStop(0, 'rgba(200,190,255,0.08)'); g.addColorStop(1, 'rgba(200,190,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 260, 90, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ============================================================
// Render
// ============================================================
function render() {
  hits = [];
  drawSky();
  viewTransform();
  drawBoard();
  drawGround();

  // everything that stands up is drawn back to front
  const items = [];
  for (const o of scenery) items.push({ d: o.flat ? -1e9 : o.x + o.y + (o.dz || 0), o });
  for (const st of stations) {
    const f = frame(st.s);
    items.push({ d: f.x + f.y - (f.rx + f.ry) * st.side * 98, st, kind: 'building' });
    const sw = signWorld(st);
    items.push({ d: sw.x + sw.y, st, kind: 'sign' });
    for (const q of st.people) {
      if (q.p.hidden) continue;
      const w = spotWorld(st, q.spot);
      items.push({ d: w.x + w.y, st, q, kind: 'person' });
    }
  }
  for (const g of ghosts) items.push({ d: g.x + g.y + 40, g, kind: 'ghost' });
  if (!inTunnel(S.s)) { const p = tp(S.s); items.push({ d: p.x + p.y, kind: 'engine' }); }
  for (let i = 0; i < NCARS; i++) {
    if (inTunnel(carS(i))) continue;
    const p = tp(carS(i));
    items.push({ d: p.x + p.y, kind: 'car', i });
  }
  items.sort((a, b) => a.d - b.d);
  for (const it of items) {
    if (it.o) {
      const o = it.o;
      if (o.kind === 'pond') drawPond(o);
      else if (o.kind === 'tree') drawTree(o);
      else if (o.kind === 'pumpkin') drawPumpkin(o);
      else if (o.kind === 'tomb') drawTomb(o);
      else if (o.kind === 'lamp') drawLamp(o);
      else if (o.kind === 'cauldron') drawCauldron(o);
      else if (o.kind === 'critter') drawCritter(o);
      else if (o.kind === 'hill') drawHill(o);
    } else if (it.kind === 'building') drawStationBuilding(it.st);
    else if (it.kind === 'sign') drawSign(it.st);
    else if (it.kind === 'person') drawPerson(it.st, it.q);
    else if (it.kind === 'ghost') drawGhost(it.g);
    else if (it.kind === 'engine') drawEngine();
    else if (it.kind === 'car') drawCar(it.i);
  }
  drawSmoke();
  drawFog();
  drawHoppers();
  for (const b of S.bats) batShape(b.x, b.y, 30, S.time * 20 + b.ph);
  drawParticles();
  drawBubbles(false);

  // vignette, then bubbles that live in screen space
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vg = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(5,0,15,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
  drawBubbles(true);
}

function updateButtons() {
  const stopped = S.mode === 'stopped';
  goBtn.classList.toggle('on', S.mode === 'go');
  stopBtn.classList.toggle('on', S.mode !== 'go');
  stopBtn.classList.toggle('pulse', !!S.approach);
  const idle = stopped && (S.atStation ? S.readyToGo : S.time - S.stoppedAt > 1.5);
  goBtn.classList.toggle('pulse', S.started && idle);
}

// ============================================================
// Main loop
// ============================================================
S.s = stationTarget(stations[0]);
resize();
let last = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000));
  last = ts;
  if (S.started) update(dt); else S.time += dt;
  render();
  updateButtons();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
